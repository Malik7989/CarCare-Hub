<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CarCare Hub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles1.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="script1.js"></script>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">CarCare Hub</div>
      <div class="header-buttons">
        <button class="theme-toggle" id="theme-toggle">
          <i class="fas fa-sun"></i>
        </button>
        <a href="index1.html" class="cta-button">Back to Home</a>
      </div>
    </header>

    <!-- Login Section -->
    <section class="login">
      <div class="login-container">
        <div class="login-image">
          <img
            src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80"
            alt="Luxury Car"
            class="car-image"
          />
          <div class="image-overlay">
            <h3>Welcome Back!</h3>
            <p>Your car deserves the best care</p>
          </div>
        </div>
        <div class="login-form-container">
          <div class="login-header">
            <h2>Login to Your Account</h2>
            <p>Access your personalized car care services</p>
          </div>

          <form class="login-form">
            <div class="form-group">
              <label for="email">Email Address</label>
              <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="Enter your email"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <div class="input-group password-group">
                <i class="fas fa-lock"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  placeholder="Enter your password"
                />
                <i class="fas fa-eye password-toggle"></i>
              </div>
            </div>

            <div class="form-options">
              <div class="remember-me">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Remember me</label>
              </div>
              <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="submit-btn">Login</button>

            <div class="social-login">
              <p>Or login with</p>
              <div class="social-buttons">
                <button type="button" class="social-btn google">
                  <i class="fab fa-google"></i> Google
                </button>
                <button type="button" class="social-btn facebook">
                  <i class="fab fa-facebook-f"></i> Facebook
                </button>
              </div>
            </div>

            <div class="register-link">
              Don't have an account? <a href="register.html">Register here</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
